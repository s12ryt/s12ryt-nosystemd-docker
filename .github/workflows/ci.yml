name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: unit (${{ matrix.os }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: debian-13
            image: "debian:13"
          - os: ubuntu-24.04
            image: "ubuntu:24.04"
          - os: alpine
            image: "alpine:latest"
    steps:
      - name: Install deps (apt)
        if: matrix.os != 'alpine'
        run: apt-get update -qq && apt-get install -y -qq bash shellcheck python3 git ca-certificates curl

      - name: Install deps (apk)
        if: matrix.os == 'alpine'
        run: apk add --no-cache bash shellcheck python3 git curl

      # 容器內不用 actions/checkout(node runtime 在 musl/glibc 容器相容性差),
      # 直接以 git fetch 簽出觸發 commit
      - name: Checkout (git)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git fetch --depth 1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD

      - name: Bash unit tests
        run: bash tests/run-tests.sh

      - name: Shellcheck
        run: shellcheck install.sh src/docker-nosystemd.sh tools/scrub-pull.sh

  go-test:
    name: dsnd-scrub go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Go tests
        run: cd tools/dsnd-scrub && go test ./...
